[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-lakehouse"
version = "0.1.0"
description = "PaySim fraud analytics on Databricks: Lakeflow Delta pipeline, Unity Catalog governance, analytical SQL, XGBoost + SHAP, MLflow, offline A/B test, Excel/Power Query, business memo."
requires-python = ">=3.10"
# No runtime dependencies: Databricks provides Spark/pandas; notebooks pip-install xgboost/shap/openpyxl.
dependencies = []

[project.optional-dependencies]
local = ["pyspark>=3.5", "pandas", "numpy", "scipy", "scikit-learn", "xgboost>=2.0", "shap", "openpyxl", "pyarrow"]

[tool.setuptools]
packages = ["fraudlake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
